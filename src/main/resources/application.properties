spring.application.name=Student-management-system

server.port = 8081
# ===============================
# = DATABASE CONFIGURATION
# ===============================

# JDBC URL (replace db_name with your database name)
spring.datasource.url=jdbc:mysql://localhost:3306/student_management_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# MySQL username and password
spring.datasource.username=root
spring.datasource.password=root

# JDBC Driver (Spring Boot usually auto-detects this, but you can add it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# ===============================
# = JPA / HIBERNATE CONFIGURATION
# ===============================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
